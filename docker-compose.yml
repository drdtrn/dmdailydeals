# Local development services. Production compose lives in compose.prod.yml (Phase 9).
# Host port 5433 because 5432 is often taken by other local Postgres instances.
name: dmdailydeals

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dmdd
      POSTGRES_PASSWORD: dmdd_dev
      POSTGRES_DB: dmdailydeals
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dmdd -d dmdailydeals']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

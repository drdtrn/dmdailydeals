name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmdd
          POSTGRES_PASSWORD: dmdd_ci
          POSTGRES_DB: dmdailydeals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmdd -d dmdailydeals"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dmdd:dmdd_ci@localhost:5432/dmdailydeals
      PAYLOAD_SECRET: ci-only-payload-secret-not-used-anywhere-else
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      PREVIEW_SECRET: ci-only-preview-secret
      # The CI database is managed by migrations only: Payload must never push schema to it.
      PAYLOAD_DB_PUSH: 'false'
      # Integration tests run against the same throwaway CI database (it is destroyed after the job).
      TEST_DATABASE_URL: postgresql://dmdd:dmdd_ci@localhost:5432/dmdailydeals

    steps:
      - uses: actions/checkout@v7

      # Installs the Node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      # Applies the committed migrations to the fresh CI database (push is disabled above).
      - name: Migrate database
        run: pnpm payload migrate

      - name: Migration status
        run: pnpm payload migrate:status

      # Fails if the collections changed without a committed migration: `migrate:create` writes a new
      # file only when the schema differs from the migrated database.
      - name: Check migrations are up to date
        run: |
          pnpm payload migrate:create ci_drift_check --skip-empty
          if [ -n "$(git status --porcelain -- src/migrations)" ]; then
            echo "Schema changed without a migration. Run: pnpm migrate:create <name>" >&2
            git status --porcelain -- src/migrations >&2
            exit 1
          fi

      - name: Integration tests
        run: pnpm test:int

      # The e2e tests read seeded content (drop, deals, stores, offer, pages). The integration tests
      # above empty the content collections when they finish, so the seed starts from a clean slate.
      # "Today" is computed in the drop timezone, so the home page always has a live drop.
      - name: Seed example content
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e --reporter=list

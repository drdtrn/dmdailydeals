name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmdd
          POSTGRES_PASSWORD: dmdd_ci
          POSTGRES_DB: dmdailydeals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmdd -d dmdailydeals"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dmdd:dmdd_ci@localhost:5432/dmdailydeals
      PAYLOAD_SECRET: ci-only-payload-secret-not-used-anywhere-else
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      PREVIEW_SECRET: ci-only-preview-secret

    steps:
      - uses: actions/checkout@v4

      # Installs the Node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      # Runs before the build on purpose: until migrations exist (Phase 2), Payload's dev-mode
      # schema push during the integration tests is what creates the tables the build reads.
      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e --reporter=list
